<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Solomon Aberra Melesse</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,700&amp;family=Geist+Mono:wght@400&amp;family=Inter:wght@400..600&amp;display=swap">
  <!-- Root-relative paths so this page also works when served for a nested missing URL -->
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/main.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <main class="not-found container">
    <p class="eyebrow">Error 404 · Page not found</p>
    <h1 class="display-xl">Nothing<br>indexed<br>here.</h1>
    <p class="section-intro">The page you’re looking for doesn’t exist or has moved. Everything lives on the home page.</p>
    <div class="hero-actions">
      <a class="btn btn-dark" href="/">Back to the portfolio</a>
      <a class="btn btn-ghost" href="/#contact">Contact me</a>
    </div>
  </main>
</body>
</html>
